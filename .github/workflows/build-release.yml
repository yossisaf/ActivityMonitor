name: Build ActivityMonitor Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: activitymonitor-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          rm -rf "$HOME/gradle-8.13"
          unzip -q /tmp/gradle.zip -d "$HOME"
          chmod +x "$HOME/gradle-8.13/bin/gradle"
          echo "$HOME/gradle-8.13/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-8.13/bin/gradle" --version

      - name: Run unit tests and build APKs
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Validate APK packages
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" | head -n 1)
          test -n "$RELEASE_APK"
          test -n "$DEBUG_APK"
          unzip -t "$RELEASE_APK" >/dev/null
          unzip -t "$DEBUG_APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$RELEASE_APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$DEBUG_APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$DEBUG_APK"

      - name: Collect APKs and signer
        run: |
          rm -rf out
          mkdir -p out
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" | head -n 1)
          cp "$RELEASE_APK" out/ActivityMonitor-release-unsigned.apk
          cp "$DEBUG_APK" out/ActivityMonitor-debug-signed.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/apksigner.jar
          sha256sum out/ActivityMonitor-release-unsigned.apk out/ActivityMonitor-debug-signed.apk > out/APK-SHA256SUMS.txt

      - name: Upload build payload
        uses: actions/upload-artifact@v4
        with:
          name: ActivityMonitor-APKs
          path: out/*
          if-no-files-found: error
