name: Build ActivityMonitor Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  issues:
    types: ["opened"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          rm -rf "$HOME/gradle-8.13"
          unzip -q /tmp/gradle.zip -d "$HOME"
          chmod +x "$HOME/gradle-8.13/bin/gradle"
          echo "$HOME/gradle-8.13/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-8.13/bin/gradle" --version

      - name: Build release
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ActivityMonitor-release
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          if-no-files-found: error
