name: Build ActivityMonitor Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  issues:
    types: ["opened"]

concurrency:
  group: activitymonitor-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          rm -rf "$HOME/gradle-8.13"
          unzip -q /tmp/gradle.zip -d "$HOME"
          chmod +x "$HOME/gradle-8.13/bin/gradle"
          echo "$HOME/gradle-8.13/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-8.13/bin/gradle" --version

      - name: Build release
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Validate APK package
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" >/dev/null

      - name: Collect unsigned APK and signer
        run: |
          rm -rf out
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          cp "$APK" out/ActivityMonitor-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/apksigner.jar
          sha256sum out/ActivityMonitor-release-unsigned.apk > out/ActivityMonitor-release-unsigned.apk.sha256

      - name: Upload build payload
        uses: actions/upload-artifact@v4
        with:
          name: ActivityMonitor-build-payload
          path: out/*
          if-no-files-found: error
